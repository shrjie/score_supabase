[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# SPA：所有路徑導回 index.html（目前使用 HashRouter，保險起見仍保留）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全性標頭
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://ufsbtxlqbhaxaavxpozo.supabase.co wss://ufsbtxlqbhaxaavxpozo.supabase.co https://*.netlify.com https://*.netlify.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
