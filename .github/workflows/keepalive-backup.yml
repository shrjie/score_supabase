name: Keep Supabase alive + backup

# 免費方案 Supabase 專案若連續 7 天低活動會被自動暫停（網站離線）。
# 本排程做兩件事：
#   1. 每天兩次打 API 產生活動，避免專案被暫停
#   2. 每週產生一次完整資料庫備份（Actions artifact，保留 30 天）
on:
  schedule:
    - cron: '10 3 * * *'
    - cron: '10 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/app_config?select=key" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "keep-alive HTTP $code"
          test "$code" = "200"

  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Supabase CLI
        run: npm install -g supabase
      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db dump --db-url "$DB_URL" -f dump.sql
      - name: Show tables included
        run: grep -c '^insert into' dump.sql || true
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: dump.sql
          retention-days: 30
